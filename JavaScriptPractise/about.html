<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Expressions</title>
</head>
<body>
    <h1>Regular Expressions</h1>
    <p class='result' style="color:whitesmoke;font-size:26px;background-color: gray; min-height: 100px;">
        The output goes here!
    </p>
    <button id='clickBtn' style="color:black;font-size:19px;">Click Me</button>

<script>
    const btn = document.querySelector('#clickBtn');
    const pTag = document.querySelector('.result');

    btn.addEventListener('click', () => {
        const myString = "Hi, do you know your abc's";
        const regex = /abc/;

        if (regex.test(myString)) {
            pTag.textContent = "Match found! The string contains 'abc'.";
        } else {
            pTag.textContent = "No match found.";
        }
    });
</script>
</body>
</html>
